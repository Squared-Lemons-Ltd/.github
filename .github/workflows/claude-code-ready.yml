name: Claude Code — Ready Issue

on:
  repository_dispatch:
    types: [claude-code-ready]

# One run per project item at a time — never cancel a running job
concurrency:
  group: claude-code-${{ github.event.client_payload.item_id }}
  cancel-in-progress: false

jobs:
  run-claude:
    name: Run Claude Code on issue
    runs-on: self-hosted

    steps:
      # ------------------------------------------------------------------
      # 1. Copy Claude OAuth credentials to a per-job temp directory
      #    Mounted read-write so token refresh works inside the container
      # ------------------------------------------------------------------
      - name: Prepare Claude credentials
        id: creds
        run: |
          JOB_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          CREDS_DIR="/tmp/claude-job-$JOB_ID"
          cp -r "$HOME/.claude" "$CREDS_DIR"
          echo "creds_dir=$CREDS_DIR" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 2. Run the Claude Code container
      # ------------------------------------------------------------------
      - name: Run Claude Code container
        env:
          GH_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          docker run --rm \
            --name "claude-job-${{ github.run_id }}-${{ github.run_attempt }}" \
            -v "${{ steps.creds.outputs.creds_dir }}:/root/.claude" \
            -e GITHUB_TOKEN="$GH_TOKEN" \
            -e TELEGRAM_BOT_TOKEN \
            -e TELEGRAM_CHAT_ID \
            -e ISSUE_NUMBER="${{ github.event.client_payload.issue_number }}" \
            -e REPO="${{ github.event.client_payload.repo }}" \
            -e ITEM_ID="${{ github.event.client_payload.item_id }}" \
            -e PROJECT_ID="${{ github.event.client_payload.project_id }}" \
            -e MAX_ITERATIONS="${{ vars.CLAUDE_MAX_ITERATIONS || '5' }}" \
            squared-lemons/claude-code-runner:latest

      # ------------------------------------------------------------------
      # 3. Always clean up the temp credentials, even on failure
      # ------------------------------------------------------------------
      - name: Clean up credentials
        if: always()
        run: rm -rf "${{ steps.creds.outputs.creds_dir }}"

name: Claude Code — Project Poller

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # allow manual trigger for testing

concurrency:
  group: claude-code-poller
  cancel-in-progress: true    # if a poll is still running, skip the next tick

jobs:
  poll:
    name: Poll all org projects for Ready items
    runs-on: self-hosted

    steps:
      - name: Find Ready items across all projects and dispatch
        env:
          GH_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
          ORG: ${{ vars.ORG_LOGIN }}
        run: |
          set -euo pipefail

          # ------------------------------------------------------------------
          # 1. Fetch all org projects (up to 100) with their fields and items
          # ------------------------------------------------------------------
          PROJECTS=$(gh api graphql -f query='
            query($org: String!) {
              organization(login: $org) {
                projectsV2(first: 100) {
                  nodes {
                    id
                    title
                    fields(first: 30) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                    items(first: 100) {
                      nodes {
                        id
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field { ... on ProjectV2FieldCommon { name } }
                            }
                          }
                        }
                        content {
                          ... on Issue {
                            number
                            repository { nameWithOwner }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          ' -f org="$ORG")

          PROJECT_COUNT=$(echo "$PROJECTS" | jq '.data.organization.projectsV2.nodes | length')
          echo "Found $PROJECT_COUNT project(s) in org $ORG"

          # ------------------------------------------------------------------
          # 2. Loop over every project
          # ------------------------------------------------------------------
          echo "$PROJECTS" | jq -c '.data.organization.projectsV2.nodes[]' | while IFS= read -r PROJECT; do
            PROJECT_ID=$(echo "$PROJECT"    | jq -r '.id')
            PROJECT_TITLE=$(echo "$PROJECT" | jq -r '.title')

            # Find the Status field for this project (skip if none)
            STATUS_FIELD=$(echo "$PROJECT" | jq -r '
              .fields.nodes[] | select(.name == "Status") | @base64
            ' | head -1)

            if [ -z "$STATUS_FIELD" ]; then
              echo "[$PROJECT_TITLE] No Status field — skipping."
              continue
            fi

            STATUS_FIELD_JSON=$(echo "$STATUS_FIELD" | base64 -d)
            STATUS_FIELD_ID=$(echo "$STATUS_FIELD_JSON"  | jq -r '.id')
            IN_PROGRESS_OPTION_ID=$(echo "$STATUS_FIELD_JSON" | jq -r '
              .options[] | select(.name == "In Progress") | .id
            ')

            if [ -z "$IN_PROGRESS_OPTION_ID" ]; then
              echo "[$PROJECT_TITLE] No 'In Progress' option on Status field — skipping."
              continue
            fi

            # ----------------------------------------------------------------
            # 3. Find items with Status == "Ready"
            # ----------------------------------------------------------------
            READY_ITEMS=$(echo "$PROJECT" | jq -c '
              .items.nodes[]
              | select(
                  .fieldValues.nodes[]?
                  | select(.field.name == "Status" and .name == "Ready")
                )
            ')

            if [ -z "$READY_ITEMS" ]; then
              echo "[$PROJECT_TITLE] No Ready items."
              continue
            fi

            echo "$READY_ITEMS" | while IFS= read -r ITEM; do
              ITEM_ID=$(echo "$ITEM"      | jq -r '.id')
              ISSUE_NUMBER=$(echo "$ITEM" | jq -r '.content.number')
              REPO=$(echo "$ITEM"         | jq -r '.content.repository.nameWithOwner')

              # Skip draft cards (no linked issue)
              if [ "$ISSUE_NUMBER" = "null" ] || [ -z "$ISSUE_NUMBER" ]; then
                echo "[$PROJECT_TITLE] Item $ITEM_ID has no linked issue — skipping."
                continue
              fi

              echo "[$PROJECT_TITLE] Dispatching claude-code-ready for $REPO#$ISSUE_NUMBER"

              # --------------------------------------------------------------
              # 4. Move to "In Progress" BEFORE dispatching — idempotency guard
              # --------------------------------------------------------------
              gh api graphql -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId:   $projectId
                    itemId:      $itemId
                    fieldId:     $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }
              ' \
                -f projectId="$PROJECT_ID" \
                -f itemId="$ITEM_ID" \
                -f fieldId="$STATUS_FIELD_ID" \
                -f optionId="$IN_PROGRESS_OPTION_ID"

              # --------------------------------------------------------------
              # 5. Dispatch to the target repo
              # --------------------------------------------------------------
              gh api "repos/$REPO/dispatches" \
                --method POST \
                --field event_type=claude-code-ready \
                --field "client_payload[issue_number]=$ISSUE_NUMBER" \
                --field "client_payload[repo]=$REPO" \
                --field "client_payload[item_id]=$ITEM_ID" \
                --field "client_payload[project_id]=$PROJECT_ID"

              echo "[$PROJECT_TITLE] Dispatched and moved to In Progress: $REPO#$ISSUE_NUMBER"
            done
          done
